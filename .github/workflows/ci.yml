name: CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  test:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.12"]

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install Project Dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements_dev.txt
          pip install pytest

      - name: Run Tests
        run: |
          pytest

      - name: Run Pylint
        run: |
          pylint actionscicd || true

      - name: Check Formatting
        run: |
          black --check . || true

      - name: Type Checking
        run: |
          mypy actionscicd || true

